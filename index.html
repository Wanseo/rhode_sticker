<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff9c4">
    <title>rhode</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #fff9c4; }
      body { font-family: Arial, sans-serif; color: #403c33; }
      main { min-height: 100svh; display: grid; place-items: center; padding: 24px; }
      button { font: inherit; cursor: pointer; }
      #start { border: 0; padding: 20px; background: transparent; color: inherit; font-size: clamp(64px, 16vw, 120px); font-weight: 600; letter-spacing: -0.075em; }
      button:focus-visible { outline: 2px solid currentColor; outline-offset: 8px; border-radius: 8px; }
      #camera { width: min(100%, 720px); text-align: center; }
      video { display: block; width: 100%; max-height: 78svh; border-radius: 24px; background: #403c33; object-fit: contain; transform: scaleX(-1); }
      #close { margin-top: 20px; padding: 10px 16px; border: 1px solid #403c33; border-radius: 24px; background: transparent; color: inherit; }
      #status { max-width: 340px; margin: 20px auto 0; text-align: center; line-height: 1.6; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div id="welcome">
        <button id="start" type="button" aria-label="rhode 카메라 켜기">rhode</button>
        <p id="status" role="status" hidden></p>
      </div>
      <section id="camera" aria-label="카메라" hidden>
        <video id="video" autoplay muted playsinline aria-label="실시간 카메라 영상"></video>
        <button id="close" type="button">카메라 닫기</button>
      </section>
    </main>
    <script>
      const start = document.querySelector('#start');
      const welcome = document.querySelector('#welcome');
      const camera = document.querySelector('#camera');
      const video = document.querySelector('#video');
      const status = document.querySelector('#status');
      let stream;
      let opening = false;

      function closeCamera() {
        stream?.getTracks().forEach(track => track.stop());
        stream = undefined;
        video.srcObject = null;
        camera.hidden = true;
        welcome.hidden = false;
      }

      start.addEventListener('click', async () => {
        if (opening) return;
        opening = true;
        start.disabled = true;
        status.hidden = true;
        try {
          if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error('UNSUPPORTED');
          }
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
          video.srcObject = stream;
          await video.play();
          welcome.hidden = true;
          camera.hidden = false;
          document.querySelector('#close').focus();
        } catch (error) {
          closeCamera();
          const messages = {
            NotAllowedError: '카메라 권한을 허용한 뒤 rhode를 다시 눌러주세요.',
            NotFoundError: '카메라를 찾을 수 없어요. 연결된 카메라를 확인해주세요.',
            NotReadableError: '카메라를 사용할 수 없어요. 다른 앱에서 사용 중인지 확인해주세요.'
          };
          status.textContent = messages[error.name] || '카메라를 켤 수 없어요. 카메라를 지원하는 브라우저에서 다시 시도해주세요.';
          status.hidden = false;
        } finally {
          opening = false;
          start.disabled = false;
        }
      });
      document.querySelector('#close').addEventListener('click', () => {
        closeCamera();
        start.focus();
      });
      window.addEventListener('pagehide', closeCamera);
    </script>
  </body>
</html>
