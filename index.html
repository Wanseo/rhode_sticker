<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>rhode</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
<section id="welcome"><button id="start" aria-label="rhode 카메라 켜기">rhode</button><p id="error" role="status" hidden></p></section>
<section id="camera" hidden aria-label="스티커 카메라">
<div id="stage">
<video id="video" autoplay muted playsinline></video><canvas id="overlay" aria-label="얼굴 스티커"></canvas>
<div id="packet-rig">
<div id="patch-tray" hidden aria-label="아이패치 두 개">
<button type="button" data-sticker="patch-flipped" aria-label="왼쪽 아이패치 집기"><img src="assets/eye-patch.svg" alt="아이패치"></button>
<button type="button" data-sticker="patch" aria-label="오른쪽 아이패치 집기"><img src="assets/eye-patch.svg" alt="아이패치"></button>
</div>
<button id="packet" type="button" aria-label="아이패치 봉투 뜯기" aria-expanded="false"><span class="tear-strip">뜯어서 열기 ↗</span><span class="packet-brand">rhode</span><span class="packet-label">PEPTIDE EYE PREP<br><small>1 pair / 2 patches</small></span></button>
</div>
<div id="case-rig">
<div id="rear-film" class="sticker-sheet" aria-hidden="true"></div>
<div id="film" class="sticker-sheet" hidden aria-label="딸기 스티커 필름"></div>
<button id="case" aria-label="스티커 케이스 열기" aria-expanded="false"><span class="lid"><span class="lid-front">rhode</span><span class="lid-mirror"></span></span><span class="hinge"></span><span class="case-inside"></span><span class="case-body"><span>rhode</span></span></button>
</div>
<div id="cursor" hidden></div>
<div class="topline"><span class="wordmark">rhode</span><span id="tracking" role="status">카메라 준비 중</span></div>
<button id="record" type="button" aria-label="영상 녹화 시작" aria-pressed="false"><span></span></button>
<p id="hint" role="status">손과 얼굴 인식을 준비하고 있어요</p>
</div>
<div class="controls"><button id="reset">Clear stickers</button><button id="close">Close camera</button></div>
<a id="download" hidden>영상 저장</a>
</section>
</main>
<script type="module" src="assets/app.js"></script>
</body></html>
